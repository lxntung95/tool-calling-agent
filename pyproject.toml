# Project metadata and dependencies; uv.lock is auto-generated from this file
[project]
name = "viral-pulse"                    # Project name; also the .venv prompt label
version = "1.0.0"                       # Your project's own version (not Python's)
description = "Viral Pulse: a tool-calling agent for weekly COVID-19, flu, and RSV activity near you, from CDC wastewater data"
requires-python = ">=3.12"              # Minimum Python version this project runs on
dependencies = [                        # Direct dependencies; ">=" sets a minimum version
    "fastapi>=0.109.0",                 # Web framework: routes, request/response validation
    "uvicorn>=0.27.0",                  # Server that runs the FastAPI app
    "litellm>=1.50",                    # One interface for calling many model providers
    "google-cloud-aiplatform>=1.40.0",  # Google Cloud libraries for Vertex AI, including authentication
    "requests>=2.31",                   # HTTP client the tools use to call external APIs
]
