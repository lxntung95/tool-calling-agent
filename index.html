<!-- Chat frontend, served by app.py at "/". Sends messages to POST /chat and displays the reply and tool calls. -->
<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Viral Pulse</title>
        <!-- Tab icon embedded directly, so the browser does not request /favicon.ico -->
        <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M0 0h24l8 8v24H0z' fill='%2334e07a'/%3E%3C/svg%3E" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
            rel="stylesheet"
        />
        <!-- Markdown rendering for replies: marked converts Markdown to HTML, DOMPurify strips anything unsafe -->
        <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
        <style>
            /* LOOK: colors, fonts, spacing, layout */

            /* Colors: light by default, dark when the OS is in dark mode */
            :root {
                color-scheme: light dark;
                --bg: #f3f5f3;          /* page background */
                --bar: #e8ece9;         /* header and input bar */
                --border: #cfd6d1;      /* dividers */
                --text: #161a17;
                --muted: #68716b;
                --user-bg: #e1e7e3;     /* your messages */
                --accent-fill: #2fcf6e; /* signature green: button, header accent, typing cursor */
                --accent-ink: #06140b;  /* text on green */
                --accent-line: #17733f; /* deeper green, readable as text and thin lines on light */
                --tool: #4e6a80;        /* tool-call accent: gunmetal steel */
                --tool-bg: #e6ebee;

                --font-body: "IBM Plex Sans", system-ui, sans-serif;
                --font-mono: "IBM Plex Mono", ui-monospace, monospace;
                --col: 760px;           /* width of the conversation column */
                --gutter: 2rem;         /* minimum side padding */
            }
            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #0b0d0c;
                    --bar: #111512;
                    --border: #222a24;
                    --text: #dde3de;
                    --muted: #7d8880;
                    --user-bg: #19201b;
                    --accent-fill: #34e07a;
                    --accent-ink: #06140b;
                    --accent-line: #34e07a;
                    --tool: #8ea4b5;
                    --tool-bg: #131a1d;
                }
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            ::selection {
                background: var(--accent-fill);
                color: var(--accent-ink);
            }
            body {
                font-family: var(--font-body);
                font-size: 1rem;
                background: var(--bg);
                color: var(--text);
                height: 100vh;
                height: 100dvh; /* accounts for mobile browser toolbars */
                display: flex;
                flex-direction: column;
            }

            /* Centers content in a readable column while bars span the full width */
            .inner {
                width: min(var(--col), 100% - 2 * var(--gutter));
                margin-inline: auto;
            }

            /* Header: agent name, one-line description, live status */
            #header {
                background: var(--bar);
                border-bottom: 1px solid color-mix(in srgb, var(--accent-line) 35%, var(--border));
            }
            #header .inner {
                position: relative;
                display: flex;
                justify-content: space-between;
                align-items: flex-end;
                gap: 1rem;
                padding: 1.25rem 0 1rem;
            }
            #header .inner::after {
                content: "";
                position: absolute;
                left: 0;
                bottom: -2px;
                width: 56px;
                height: 3px;
                background: var(--accent-fill);
            }
            h1 {
                font-weight: 600;
                font-size: 1.3rem;
                letter-spacing: -0.01em;
                line-height: 1.2;
            }
            #tagline {
                color: var(--muted);
                font-size: 0.95rem;
                margin-top: 0.2rem;
            }
            #header-actions {
                display: flex;
                align-items: center;
                gap: 1.25rem;
            }
            #status {
                display: flex;
                align-items: center;
                gap: 0.5rem;
                font-size: 0.85rem;
                color: var(--muted);
                white-space: nowrap;
            }
            #status .dot {
                width: 7px;
                height: 7px;
                background: var(--accent-line);
            }
            #status.working .dot {
                animation: pulse 0.9s ease-in-out infinite;
            }
            @keyframes pulse {
                50% { opacity: 0.25; }
            }

            /* Conversation: scrolls full width, content stays in the column */
            #messages {
                flex: 1;
                overflow-y: auto;
                padding: 2rem max(var(--gutter), (100% - var(--col)) / 2);
                display: flex;
                flex-direction: column;
                gap: 1.4rem;
            }
            .msg {
                line-height: 1.6;
                max-width: 85%;
            }
            .msg .role {
                font-size: 0.8rem;
                font-weight: 500;
                color: var(--muted);
                margin-bottom: 0.3rem;
            }
            .msg.assistant .role {
                color: var(--accent-line);
            }
            .msg.assistant .content {
                border-left: 2px solid var(--border);
                padding-left: 0.9rem;
            }
            .msg.user {
                align-self: flex-end;
                background: var(--user-bg);
                padding: 0.7rem 1rem;
                clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%);
            }
            .msg.loading .content {
                color: var(--muted);
            }
            .msg.loading .content::after {
                content: "";
                display: inline-block;
                width: 0.5em;
                height: 1em;
                margin-left: 0.3em;
                vertical-align: -0.15em;
                background: var(--accent-fill);
                animation: pulse 0.9s steps(1) infinite;
            }

            /* Formatting inside rendered replies (lists, paragraphs, bold) */
            .content p + p,
            .content p + ul,
            .content ul + p { margin-top: 0.6rem; }
            .content ul,
            .content ol { padding-left: 1.2rem; margin-top: 0.3rem; }
            .content li + li { margin-top: 0.2rem; }
            .content strong { font-weight: 600; }
            .content code { font-family: var(--font-mono); font-size: 0.85em; }

            /* Tool calls the harness ran: one summary line, click to expand the full result */
            .tool {
                max-width: 85%;
                font-family: var(--font-mono);
                font-size: 0.78rem;
                line-height: 1.5;
                color: var(--muted);
                background: var(--tool-bg);
                border-left: 2px solid var(--tool);
            }
            .tool summary {
                list-style: none; /* hide the default triangle; the chevron below replaces it */
                cursor: pointer;
                padding: 0.55rem 0.8rem;
                display: flex;
                gap: 0.6rem;
                align-items: baseline;
            }
            .tool summary::-webkit-details-marker {
                display: none;
            }
            .tool summary::before {
                content: "\203A"; /* single right-pointing angle, rotates when open */
                color: var(--tool);
                display: inline-block;
                transition: transform 0.15s;
            }
            .tool[open] summary::before {
                transform: rotate(90deg);
            }
            .tool summary:focus-visible {
                outline: 2px solid var(--tool);
                outline-offset: -2px;
            }
            .tool .label {
                color: var(--tool);
                white-space: nowrap;
            }
            .tool .call {
                overflow-wrap: anywhere;
            }
            .tool pre {
                margin: 0;
                padding: 0 0.8rem 0.7rem 1.9rem;
                max-height: 320px;
                overflow: auto;
                white-space: pre-wrap;
                word-break: break-word;
                font-family: var(--font-mono);
            }

            /* Input bar, docked at the bottom */
            #input-bar {
                background: var(--bar);
                border-top: 1px solid var(--border);
            }
            #input-bar .inner {
                display: flex;
                gap: 1rem;
                padding: 1rem 0 1.25rem;
            }
            #user-input {
                flex: 1;
                padding: 0.75rem 0;
                border: none;
                border-bottom: 1px solid var(--border);
                background: transparent;
                color: var(--text);
                font-family: var(--font-body);
                font-size: 1rem;
                outline: none;
                transition: border-color 0.15s;
            }
            #user-input:focus {
                border-bottom-color: var(--accent-line);
            }
            #user-input::placeholder {
                color: var(--muted);
            }
            button {
                padding: 0.75rem 1.75rem;
                background: var(--accent-fill);
                color: var(--accent-ink);
                border: none;
                font-family: var(--font-body);
                font-weight: 600;
                font-size: 0.95rem;
                cursor: pointer;
                clip-path: polygon(0 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%);
            }
            button:hover {
                filter: brightness(1.08);
            }
            button:focus-visible {
                outline: 2px solid var(--text);
                outline-offset: -4px;
            }
            button:disabled {
                opacity: 0.35;
                cursor: default;
            }
            /* Secondary button: outlined, so Send stays the only filled accent */
            #new-chat-btn {
                padding: 0.4rem 0.9rem;
                white-space: nowrap;
                background: transparent;
                color: var(--text);
                border: 1px solid var(--border);
                font-weight: 500;
                font-size: 0.85rem;
            }
            #new-chat-btn:hover {
                border-color: var(--accent-line);
                filter: none;
            }

            /* Small screens */
            @media (max-width: 600px) {
                :root { --gutter: 1.1rem; }
                #tagline { display: none; }
                .msg, .tool { max-width: 92%; }
            }
            @media (prefers-reduced-motion: reduce) {
                * { animation: none !important; transition: none !important; }
            }
        </style>
    </head>
    <body>
        <!-- STRUCTURE: header bar (name, description, status, New chat), conversation, input bar -->
        <header id="header">
            <div class="inner">
                <div>
                    <h1>Viral Pulse</h1>
                    <p id="tagline">COVID-19, flu, RSV, measles, and bird flu near you, from CDC wastewater.</p>
                </div>
                <div id="header-actions">
                    <div id="status"><span class="dot"></span><span class="status-text">Ready</span></div>
                    <button id="new-chat-btn" type="button" title="Start a new conversation">New chat</button>
                </div>
            </div>
        </header>
        <main id="messages"></main>
        <footer id="input-bar">
            <div class="inner">
                <input
                    type="text"
                    id="user-input"
                    placeholder="Ask about a place, like &quot;How's flu in New York City this week?&quot;"
                    autocomplete="off"
                />
                <button id="send-btn">Send</button>
            </div>
        </footer>
        <script>
            // BEHAVIOR: sends messages to /chat, keeps sessionId, renders the reply and tool calls; New chat calls /clear
            // Keep the /chat contract: send {message, session_id}; read response, session_id, tool_calls
            const messages = document.getElementById("messages");
            const userInput = document.getElementById("user-input");
            const sendBtn = document.getElementById("send-btn");
            const statusEl = document.getElementById("status");
            const newChatBtn = document.getElementById("new-chat-btn");
            let sessionId = null;

            // Header status: "Working" while waiting on the agent, "Ready" otherwise
            function setStatus(working) {
                statusEl.classList.toggle("working", working);
                statusEl.querySelector(".status-text").textContent = working ? "Working" : "Ready";
            }

            // Add a message bubble; text is inserted as plain text, never as HTML
            function addMessage(role, text, isLoading = false) {
                const div = document.createElement("div");
                div.className =
                    "msg " +
                    (role === "you" ? "user" : "assistant") +
                    (isLoading ? " loading" : "");
                const roleEl = document.createElement("div");
                roleEl.className = "role";
                roleEl.textContent = role;
                const content = document.createElement("div");
                content.className = "content";
                content.textContent = text;
                div.append(roleEl, content);
                messages.appendChild(div);
                messages.scrollTop = messages.scrollHeight;
                return div;
            }

            // Show the agent's Markdown reply as formatted HTML; fall back to plain text if the libraries did not load
            function showReply(contentEl, markdown) {
                if (window.marked && window.DOMPurify) {
                    contentEl.innerHTML = DOMPurify.sanitize(marked.parse(markdown));
                } else {
                    contentEl.textContent = markdown;
                }
            }

            // One tool call as a collapsible block: the summary shows the call, the body shows the full result
            function renderToolCall(call) {
                const details = document.createElement("details");
                details.className = "tool";

                const summary = document.createElement("summary");
                const label = document.createElement("span");
                label.className = "label";
                label.textContent = "tool call";
                const signature = document.createElement("span");
                signature.className = "call";
                const args = Object.values(call.args || {}).map((v) => JSON.stringify(v)).join(", ");
                signature.textContent = call.name + "(" + args + ")";
                summary.append(label, signature);

                // Pretty-print the result when it is JSON; otherwise show it as-is
                const body = document.createElement("pre");
                try {
                    body.textContent = JSON.stringify(JSON.parse(call.result), null, 2);
                } catch {
                    body.textContent = String(call.result);
                }

                details.append(summary, body);
                return details;
            }

            // New chat: forget this session on the server, then clear the page
            async function newChat() {
                if (sessionId) {
                    try {
                        await fetch("/clear?session_id=" + encodeURIComponent(sessionId), { method: "POST" });
                    } catch (e) {
                        // Not fatal: a fresh session starts below either way
                    }
                }
                sessionId = null;
                messages.replaceChildren();
                userInput.value = "";
                userInput.focus();
            }

            async function send() {
                const text = userInput.value.trim();
                if (!text) return;

                userInput.value = "";
                sendBtn.disabled = true;
                newChatBtn.disabled = true;
                setStatus(true);
                addMessage("you", text);
                const loading = addMessage("assistant", "Thinking", true);

                try {
                    const res = await fetch("/chat", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            message: text,
                            session_id: sessionId,
                        }),
                    });
                    const data = await res.json();
                    sessionId = data.session_id;

                    // Show each tool the harness ran, above the assistant's answer
                    for (const call of data.tool_calls || []) {
                        messages.insertBefore(renderToolCall(call), loading);
                    }
                    showReply(loading.querySelector(".content"), data.response);
                    loading.classList.remove("loading");
                } catch (e) {
                    loading.querySelector(".content").textContent =
                        "Error: " + e.message;
                    loading.classList.remove("loading");
                }
                messages.scrollTop = messages.scrollHeight;
                setStatus(false);
                sendBtn.disabled = false;
                newChatBtn.disabled = false;
                userInput.focus();
            }

            sendBtn.addEventListener("click", send);
            newChatBtn.addEventListener("click", newChat);
            userInput.addEventListener("keydown", function (e) {
                if (e.key === "Enter") send();
            });
            userInput.focus();
        </script>
    </body>
</html>
